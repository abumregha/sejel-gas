{% extends 'base.html' %}

{% block title %}حذف {{ object }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-full bg-danger/10 flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-danger"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">تأكيد الحذف</h2>
        </div>
        <p class="text-gray-600 mb-6">هل أنت متأكد من حذف <strong>{{ object }}</strong>؟ لا يمكن التراجع عن هذا الإجراء.</p>
        <div class="flex gap-3">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="bg-danger text-white px-4 py-2 rounded-lg hover:bg-danger/90 transition-colors">حذف</button>
            </form>
            <a href="{% url cancel_url %}" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors">إلغاء</a>
        </div>
    </div>
</div>
{% endblock %}
