{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-4">
        <a href="{% url 'tank_detail' pk=tank.pk %}" class="text-primary text-sm hover:underline">← العودة للخزان</a>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h3 class="text-lg font-semibold mb-1">{{ page_title }}</h3>
        <p class="text-sm text-gray-500 mb-6">الخزان: {{ tank.name|default:tank.fuel_type }} — {{ tank.fuel_type }} — السعة: {{ tank.capacity|intcomma }} لتر</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">نوع القراءة</label>
                <select name="reading_type" class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
                    <option value="opening">قراءة افتتاحية</option>
                    <option value="pre_delivery">قبل الشحنة</option>
                    <option value="post_delivery" selected>بعد الشحنة</option>
                    <option value="daily">قراءة يومية</option>
                    <option value="other">قراءة أخرى</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">مستوى القراءة (لتر)</label>
                <input type="number" step="0.001" name="reading_level" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary/20 focus:border-primary"
                    placeholder="مثال: 15000">
                <p class="text-xs text-gray-400 mt-1">الرصيد الحالي: {{ tank.current_level|intcomma }} لتر</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">التاريخ والوقت</label>
                <input type="datetime-local" name="recorded_at" value="{{ initial_recorded_at }}"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary/20 focus:border-primary">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ملاحظات (اختياري)</label>
                <textarea name="notes" rows="2" class="w-full border border-gray-300 rounded-lg px-4 py-2.5"></textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="bg-primary text-white px-6 py-2.5 rounded-lg hover:bg-primary/90 transition-colors">حفظ القراءة</button>
                <a href="{% url 'tank_detail' pk=tank.pk %}" class="px-6 py-2.5 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
