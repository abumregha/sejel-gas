{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h2 class="text-xl font-bold">طلب توريد جديد</h2>
        <p class="text-sm text-gray-500 mt-1">تقديم طلب توريد وقود من شركة التسويق</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">المحطة <span class="text-danger">*</span></label>
                <select name="station" id="station-select" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
                        onchange="loadTanks(this.value)">
                    <option value="">-- اختر المحطة --</option>
                    {% for station in stations %}
                    <option value="{{ station.pk }}">{{ station.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الخزان <span class="text-danger">*</span></label>
                <select name="tank" id="tank-select" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
                    <option value="">-- اختر الخزان --</option>
                </select>
                <div id="tank-info" class="text-xs text-gray-500 mt-1"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الكمية المطلوبة (لتر) <span class="text-danger">*</span></label>
                    <input type="number" name="requested_quantity" required step="0.001" min="1"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="0.000">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الأولوية</label>
                    <select name="priority" class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
                        <option value="normal">عادي</option>
                        <option value="urgent">عاجل</option>
                        <option value="critical">حرج</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">التاريخ المتوقع للوصول</label>
                <input type="date" name="expected_delivery_date" class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">سبب الطلب</label>
                <textarea name="reason" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="سبب الطلب مثل: انخفاض مستوى الخزان، زيادة الطلب، إلخ..."></textarea>
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition-colors">
                إرسال الطلب
            </button>
            <a href="{% url 'delivery_request_list' %}" class="px-6 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                إلغاء
            </a>
        </div>
    </form>
</div>

<script>
function loadTanks(stationId) {
    if (!stationId) return;
    fetch(`/inventory/tanks/json/?station=${stationId}`)
        .then(r => r.json())
        .then(data => {
            const select = document.getElementById('tank-select');
            select.innerHTML = '<option value="">-- اختر الخزان --</option>';
            data.forEach(tank => {
                select.add(new Option(`${tank.name} (${tank.fuel_type}) - ${tank.current_level} لتر`, tank.id));
            });
        });
}
</script>
{% endblock %}
