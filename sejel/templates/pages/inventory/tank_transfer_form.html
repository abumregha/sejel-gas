{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h2 class="text-xl font-bold">تحويل بين الخزانات</h2>
        <p class="text-sm text-gray-500 mt-1">نقل وقود من خزان إلى آخر (نفس نوع الوقود)</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">المحطة</label>
                <select name="station" id="station-select" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5"
                        onchange="loadTanks(this.value)">
                    <option value="">-- اختر المحطة --</option>
                    {% for station in stations %}
                    <option value="{{ station.pk }}">{{ station.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الخزان المصدر <span class="text-danger">*</span></label>
                    <select name="from_tank" id="from-tank" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
                        <option value="">-- اختر الخزان --</option>
                    </select>
                    <div id="from-tank-info" class="text-xs text-gray-500 mt-1"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">الخزان الوجهة <span class="text-danger">*</span></label>
                    <select name="to_tank" id="to-tank" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
                        <option value="">-- اختر الخزان --</option>
                    </select>
                    <div id="to-tank-info" class="text-xs text-gray-500 mt-1"></div>
                </div>
            </div>

            <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-700" id="transfer-warning" style="display:none">
                <i data-lucide="alert-triangle" class="w-4 h-4 inline"></i>
                <span id="transfer-warning-text"></span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">الكمية (لتر) <span class="text-danger">*</span></label>
                <input type="number" name="quantity" id="quantity-input" required step="0.001" min="0.001"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="0.000">
                <div id="quantity-help" class="text-xs text-gray-500 mt-1"></div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">تاريخ ووقت النقل <span class="text-danger">*</span></label>
                <input type="datetime-local" name="transfer_date" required value="{{ today }}"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ملاحظات</label>
                <textarea name="notes" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="سبب التحويل أو أي ملاحظات..."></textarea>
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition-colors">
                تنفيذ التحويل
            </button>
            <a href="{% url 'tank_transfer_list' %}" class="px-6 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                إلغاء
            </a>
        </div>
    </form>
</div>

<script>
let tanksData = {};

function loadTanks(stationId) {
    if (!stationId) return;
    fetch(`/inventory/tanks/json/?station=${stationId}`)
        .then(r => r.json())
        .then(data => {
            tanksData = data;
            const fromSelect = document.getElementById('from-tank');
            const toSelect = document.getElementById('to-tank');
            fromSelect.innerHTML = '<option value="">-- اختر الخزان --</option>';
            toSelect.innerHTML = '<option value="">-- اختر الخزان --</option>';
            data.forEach(tank => {
                const opt1 = new Option(`${tank.name} (${tank.fuel_type}) - ${tank.current_level} لتر`, tank.id);
                const opt2 = new Option(`${tank.name} (${tank.fuel_type}) - ${tank.current_level} لتر`, tank.id);
                fromSelect.add(opt1);
                toSelect.add(opt2);
            });
            updateInfo();
        });
}

function updateInfo() {
    const fromId = document.getElementById('from-tank').value;
    const toId = document.getElementById('to-tank').value;
    const qty = parseFloat(document.getElementById('quantity-input').value) || 0;
    const warning = document.getElementById('transfer-warning');
    const warningText = document.getElementById('transfer-warning-text');
    const fromInfo = document.getElementById('from-tank-info');
    const toInfo = document.getElementById('to-tank-info');
    const help = document.getElementById('quantity-help');
    
    const fromTank = tanksData.find(t => t.id == fromId);
    const toTank = tanksData.find(t => t.id == toId);
    
    if (fromTank) {
        fromInfo.textContent = `الرصيد: ${fromTank.current_level} لتر | السعة: ${fromTank.capacity} لتر`;
    } else {
        fromInfo.textContent = '';
    }
    
    if (toTank) {
        toInfo.textContent = `الرصيد: ${toTank.current_level} لتر | السعة: ${toTank.capacity} لتر`;
    } else {
        toInfo.textContent = '';
    }
    
    warning.style.display = 'none';
    help.textContent = '';
    
    if (fromTank && toTank) {
        if (fromTank.fuel_type !== toTank.fuel_type) {
            warning.style.display = 'block';
            warningText.textContent = 'لا يمكن النقل بين خزانات بأنواع وقود مختلفة';
        } else if (fromId === toId) {
            warning.style.display = 'block';
            warningText.textContent = 'لا يمكن النقل من خزان إلى نفسه';
        } else if (qty > 0) {
            if (qty > fromTank.current_level) {
                help.textContent = `⚠️ الكمية أكبر من الرصيد المتاح (${fromTank.current_level} لتر)`;
                help.classList.add('text-danger');
            } else if (qty > (toTank.capacity - toTank.current_level)) {
                const remaining = toTank.capacity - toTank.current_level;
                help.textContent = `⚠️ الكمية تتجاوز المساحة المتاحة (${remaining} لتر) في الخزان الوجهة`;
                help.classList.add('text-danger');
            } else {
                help.textContent = `✓ سيتم تحويل ${qty} لتر من ${fromTank.name} إلى ${toTank.name}`;
                help.classList.remove('text-danger');
            }
        }
    }
}

document.getElementById('from-tank').addEventListener('change', updateInfo);
document.getElementById('to-tank').addEventListener('change', updateInfo);
document.getElementById('quantity-input').addEventListener('input', updateInfo);
</script>
{% endblock %}
