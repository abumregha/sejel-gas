{% extends 'base.html' %}

{% block title %}فئات الكوبونات{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div></div>
    <a href="{% url 'voucher_category_create' %}" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i>
        إضافة فئة
    </a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">الاسم</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">القيمة</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">نشط</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for vc in voucher_categories %}
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 font-medium">{{ vc.name }}</td>
                    <td class="px-4 py-3 text-gray-600">{{ vc.value }} د.ل</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs {% if vc.is_active %}bg-success/10 text-success{% else %}bg-gray-100 text-gray-600{% endif %}">
                            {% if vc.is_active %}نشط{% else %}غير نشط{% endif %}
                        </span>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="px-4 py-8 text-center text-gray-500">لا توجد فئات</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
