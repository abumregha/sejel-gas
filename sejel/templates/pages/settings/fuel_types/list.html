{% extends 'base.html' %}

{% block title %}أنواع الوقود{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div></div>
    <a href="{% url 'fuel_type_create' %}" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i>
        إضافة نوع
    </a>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">الاسم</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">الاسم (EN)</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">إجراءات</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for ft in fuel_types %}
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 font-medium">{{ ft.name }}</td>
                    <td class="px-4 py-3 text-gray-600">{{ ft.name_en|default:"-" }}</td>
                    <td class="px-4 py-3 flex gap-2">
                        <a href="{% url 'fuel_type_edit' pk=ft.pk %}" class="text-primary hover:text-primary/80 transition-colors">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </a>
                        <a href="{% url 'fuel_type_delete' pk=ft.pk %}" class="text-danger hover:text-danger/80 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="px-4 py-8 text-center text-gray-500">لا توجد أنواع وقود</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
