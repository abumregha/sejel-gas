{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">المناوبة</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">المبلغ</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">الوقت</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">المرجع</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">إجراءات</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for c in collections %}
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3">
                        <a href="{% url 'shift_detail' pk=c.shift.pk %}" class="text-primary hover:text-primary/80">#{{ c.shift.id }}</a>
                    </td>
                    <td class="px-4 py-3 font-medium" dir="ltr">{{ c.amount|intcomma }} د.ل</td>
                    <td class="px-4 py-3 text-gray-600" dir="ltr">{{ c.time|date:"Y-m-d H:i" }}</td>
                    <td class="px-4 py-3 text-gray-600">{{ c.reference|default:"-" }}</td>
                    <td class="px-4 py-3 flex gap-2">
                        <a href="{% url 'cash_edit' pk=c.pk %}" class="text-primary hover:text-primary/80 transition-colors">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </a>
                        <a href="{% url 'cash_delete' pk=c.pk %}" class="text-danger hover:text-danger/80 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="px-4 py-8 text-center text-gray-500">لا توجد تحصيلات نقدي</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
