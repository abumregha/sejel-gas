{% extends 'base.html' %}
{% load humanize %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h2 class="text-xl font-bold">تسجيل تسليم كوبونات</h2>
        <p class="text-sm text-gray-500 mt-1">تسجيل الكوبونات المسلمة لشركة الرحمة</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">المحطة <span class="text-danger">*</span></label>
                <select name="station" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
                    <option value="">-- اختر المحطة --</option>
                    {% for station in stations %}
                    <option value="{{ station.pk }}">{{ station.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">تاريخ التسليم <span class="text-danger">*</span></label>
                <input type="date" name="submission_date" required value="{{ today }}"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5">
            </div>

            <div class="border-t border-gray-200 pt-4">
                <label class="block text-sm font-medium text-gray-700 mb-3">عدد الكوبونات حسب الفئة</label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-blue-50/50 border border-blue-100 rounded-lg p-4 text-center">
                        <div class="text-gray-600 text-sm mb-2">كوبونات 5 د.ل</div>
                        <input type="number" name="denom_5" id="denom_5" value="0" min="0"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg font-bold"
                               oninput="calcTotal()">
                        <div class="text-xs text-gray-500 mt-1" id="val_5">= 0 د.ل</div>
                    </div>
                    <div class="bg-green-50/50 border border-green-100 rounded-lg p-4 text-center">
                        <div class="text-gray-600 text-sm mb-2">كوبونات 6 د.ل</div>
                        <input type="number" name="denom_6" id="denom_6" value="0" min="0"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg font-bold"
                               oninput="calcTotal()">
                        <div class="text-xs text-gray-500 mt-1" id="val_6">= 0 د.ل</div>
                    </div>
                    <div class="bg-amber-50/50 border border-amber-100 rounded-lg p-4 text-center">
                        <div class="text-gray-600 text-sm mb-2">كوبونات 8 د.ل</div>
                        <input type="number" name="denom_8" id="denom_8" value="0" min="0"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg font-bold"
                               oninput="calcTotal()">
                        <div class="text-xs text-gray-500 mt-1" id="val_8">= 0 د.ل</div>
                    </div>
                </div>
                
                <div class="mt-4 bg-gray-50 rounded-lg p-4 text-center">
                    <div class="text-sm text-gray-600">الإجمالي</div>
                    <div class="text-2xl font-bold text-primary" id="total-display">0 د.ل</div>
                    <div class="text-xs text-gray-500" id="count-display">0 كوبون</div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ملاحظات</label>
                <textarea name="notes" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="أي ملاحظات حول التسليم..."></textarea>
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition-colors">
                تسجيل التسليم
            </button>
            <a href="{% url 'settlement_list' %}" class="px-6 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                إلغاء
            </a>
        </div>
    </form>
</div>

<script>
function calcTotal() {
    const d5 = parseInt(document.getElementById('denom_5').value) || 0;
    const d6 = parseInt(document.getElementById('denom_6').value) || 0;
    const d8 = parseInt(document.getElementById('denom_8').value) || 0;
    
    const v5 = d5 * 5;
    const v6 = d6 * 6;
    const v8 = d8 * 8;
    
    document.getElementById('val_5').textContent = `= ${v5.toLocaleString()} د.ل`;
    document.getElementById('val_6').textContent = `= ${v6.toLocaleString()} د.ل`;
    document.getElementById('val_8').textContent = `= ${v8.toLocaleString()} د.ل`;
    
    const total = v5 + v6 + v8;
    const count = d5 + d6 + d8;
    
    document.getElementById('total-display').textContent = `${total.toLocaleString()} د.ل`;
    document.getElementById('count-display').textContent = `${count.toLocaleString()} كوبون`;
}
</script>
{% endblock %}
