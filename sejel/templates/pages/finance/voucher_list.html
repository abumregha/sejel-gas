{% extends 'base.html' %}

{% block title %}الكوبونات{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div></div>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">الفئة</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">العدد</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">الإجمالي</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">المناوبة</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for v in vouchers %}
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 font-medium">{{ v.category.name }}</td>
                    <td class="px-4 py-3 text-gray-600">{{ v.count }}</td>
                    <td class="px-4 py-3 text-gray-600">{{ v.total_value }} د.ل</td>
                    <td class="px-4 py-3 text-gray-600">#{{ v.shift_id }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="px-4 py-8 text-center text-gray-500">لا توجد كوبونات</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
